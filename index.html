<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="color-scheme" content="light">
<title>案件ノート</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,700;1,400&family=Noto+Sans+JP:wght@300;400;500;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
html,body,*{color-scheme:light!important}
@media(prefers-color-scheme:dark){html{background:#F6F5F1!important;color:#1A1916!important}}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#F6F5F1;--surface:#FFFFFF;--surface-2:#F0EDE7;--border:#E2DDD5;
  --accent:#2B4A3A;--accent-mid:#3D6B55;--accent-light:#E8F2EC;--accent-glow:rgba(43,74,58,0.12);
  --text:#1A1916;--text-2:#5C574F;--text-3:#9C9488;
  --gold:#C9A84C;--danger:#9B3A2F;--danger-light:#FDF0EE;
  --warn:#9A6820;--warn-light:#FBF0DC;
  --tag-bg:#EAE6DE;
  --shadow:0 1px 4px rgba(26,25,22,0.07);
  --shadow-lg:0 12px 48px rgba(26,25,22,0.13),0 4px 12px rgba(26,25,22,0.07);
  --radius:14px;--radius-sm:8px;
  --font-display:'Playfair Display','Georgia',serif;
  --font-mono:'JetBrains Mono','Courier New',monospace;
  --font-body:'Noto Sans JP',-apple-system,'Hiragino Sans',sans-serif;
  --bg-card:#FFFFFF;--bg-card2:#F0EDE7;
  --accent2:#4A7A96;--accent2-light:#E6F0F6;
  --text-sub:#5C574F;--text-muted:#9C9488;
}
html{color-scheme:light only}
html{color-scheme:light!important;-webkit-color-scheme:light!important}
html,body{height:100%;background:var(--bg)!important;font-family:var(--font-body);color:var(--text)!important;font-size:15px;-webkit-tap-highlight-color:transparent;-webkit-font-smoothing:antialiased}
body{display:flex;flex-direction:column;overflow:hidden}

/* ─── ヘッダー（Trip Memo準拠） ─── */
#header{flex-shrink:0;z-index:10}
.header{background:var(--accent);padding:0 18px;height:58px;display:flex;align-items:center;justify-content:space-between;flex-shrink:0;position:relative}
.header::after{content:'';position:absolute;bottom:0;left:0;right:0;height:2px;background:linear-gradient(90deg,var(--gold),transparent 55%)}
.header-left{display:flex;align-items:baseline;gap:8px}
.header-title{font-family:var(--font-display);font-weight:700;font-size:20px;color:#fff;letter-spacing:0.06em}
.header-sub{font-size:10px;color:rgba(255,255,255,0.45);font-family:var(--font-mono);letter-spacing:0.14em}
.header-right{display:flex;align-items:center;gap:6px}
.icon-btn{background:rgba(255,255,255,0.12);border:none;color:rgba(255,255,255,0.8);width:32px;height:32px;border-radius:50%;font-size:15px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:.15s}
.icon-btn:active{transform:scale(.92)}

/* タブ */
.tabs{display:flex;gap:0;border-bottom:1px solid var(--border);background:var(--surface)!important;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex-shrink:0;padding:12px 16px;font-size:12.5px;font-weight:400;color:var(--text-3)!important;background:none;border:none;cursor:pointer;position:relative;transition:.15s;letter-spacing:.05em;font-family:var(--font-body);white-space:nowrap}
.tab.active{color:var(--accent);font-weight:700}
.tab.active::after{content:'';position:absolute;bottom:0;left:8px;right:8px;height:2px;background:var(--accent);border-radius:2px}

/* 検索・フィルター */
.search-bar{display:flex;align-items:center;gap:8px;padding:8px 14px;background:var(--surface)!important;border-bottom:1px solid var(--border);flex-shrink:0}
.search-wrap{flex:1;position:relative;display:flex;align-items:center;background:var(--surface-2)!important;border:1.5px solid var(--border);border-radius:10px;padding:0 12px;gap:8px;transition:border-color .2s,box-shadow .2s}
.search-wrap:focus-within{border-color:var(--accent-mid);box-shadow:0 0 0 3px var(--accent-glow);background:var(--surface)!important}
.search-wrap input{flex:1;min-width:0;height:38px;border:none;background:transparent;font-size:16px;color:var(--text)!important;outline:none;font-family:var(--font-body)}
.search-wrap input::placeholder{color:var(--text-3)!important}
.search-icon{color:var(--text-3)!important;font-size:15px;pointer-events:none;flex-shrink:0}
.filter-btn{flex-shrink:0;background:var(--surface-2)!important;border:1.5px solid var(--border);border-radius:10px;width:38px;height:38px;font-size:17px;cursor:pointer;display:flex;align-items:center;justify-content:center;color:var(--text-2)!important;transition:.15s}
.filter-btn.active{background:var(--accent-light);border-color:var(--accent-mid);color:var(--accent)}

/* ─── スクロールリスト ─── */
#main{flex:1;overflow-y:auto;padding:12px 16px;padding-bottom:90px;background:var(--bg)!important}
.empty-state{text-align:center;padding:64px 24px;color:var(--text-3)!important}
.empty-state .icon{font-size:48px;margin-bottom:12px}
.empty-state p{font-size:14px}

/* ─── カード ─── */
.card-wrap{position:relative;margin-bottom:10px;border-radius:var(--radius);overflow:hidden}
.card-bg{position:absolute;inset:0;background:var(--danger);display:flex;align-items:center;justify-content:flex-end;padding-right:20px;color:#fff;font-size:13px;font-weight:600;opacity:0}
.card{background:var(--surface)!important;border-radius:var(--radius);border:1px solid var(--border);padding:14px;position:relative;cursor:pointer;transition:transform .18s,box-shadow .18s;will-change:transform}
.card:active{box-shadow:var(--shadow)}
.card-header{display:flex;align-items:flex-start;gap:8px;margin-bottom:8px}
.priority-mark{flex-shrink:0;width:8px;height:8px;border-radius:50%;margin-top:5px}
.priority-high{background:#E05050}
.priority-mid{background:#E09020}
.priority-low{background:#70B090}
.card-title{font-size:15px;font-weight:700;flex:1;line-height:1.35;font-family:var(--font-display);color:var(--text)!important}
.status-badge{flex-shrink:0;font-size:11px;font-weight:700;padding:3px 8px;border-radius:20px;letter-spacing:.3px}
.st-candidate{background:#EDF2FB;color:#3D5A9E}
.st-contact{background:#FDF3E3;color:#8B6020}
.st-proposal{background:#E8F5FF;color:#1A6FA8}
.st-negotiation{background:#F0EAF8;color:#6A3CA0}
.st-won{background:var(--accent-light);color:var(--accent-mid)}
.st-lost{background:#F5F0EF;color:#8A6A65}
.st-hold{background:var(--tag-bg);color:var(--text-sub)!important}

.card-body{font-size:13px;color:var(--text-2)!important;line-height:1.5;margin-bottom:8px}
.card-meta{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.tag{font-size:11px;background:var(--surface-2)!important;color:var(--text-2)!important;border:1px solid var(--border);padding:2px 8px;border-radius:20px;font-family:var(--font-mono);font-size:10.5px}
.tag.source{background:var(--accent2-light);color:var(--accent2)}
.card-amount{font-size:13px;font-weight:700;color:var(--accent);margin-left:auto;font-family:var(--font-mono)}
.card-date{font-size:11px;color:var(--text-muted)!important}
.next-action{display:flex;align-items:center;gap:4px;margin-top:8px;padding:6px 10px;background:var(--warn-light);border-radius:var(--radius-sm);font-size:12px;color:var(--warn);font-weight:600}

/* ─── FAB ─── */
.fab{position:fixed;bottom:24px;right:20px;width:54px;height:54px;border-radius:50%;background:var(--gold);color:#fff;font-size:26px;border:none;cursor:pointer;box-shadow:0 4px 16px rgba(201,168,76,.35);display:flex;align-items:center;justify-content:center;transition:.18s;z-index:50}
.fab:active{transform:scale(.92)}

/* ─── ダッシュボード ─── */
#dash{flex:1;overflow-y:auto;padding:16px;padding-bottom:90px;display:none;background:var(--bg)!important}
.dash-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:16px}
.kpi{background:var(--surface)!important;border-radius:var(--radius);border:1px solid var(--border);padding:14px}
.kpi-label{font-size:10px;color:var(--text-3)!important;font-weight:700;letter-spacing:.1em;text-transform:uppercase;margin-bottom:4px;font-family:var(--font-mono)}
.kpi-val{font-size:28px;font-weight:700;line-height:1.1;font-family:var(--font-mono)}
.kpi-val.accent{color:var(--accent)}
.kpi-sub{font-size:12px;color:var(--text-2)!important;margin-top:2px}
.chart-card{background:var(--surface)!important;border-radius:var(--radius);border:1px solid var(--border);padding:16px;margin-bottom:10px}
.chart-title{font-size:15px;font-weight:700;margin-bottom:14px;color:var(--text)!important;font-family:var(--font-display)}
canvas{width:100%!important}

/* ─── スライドアップシート ─── */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.4)!important;z-index:100;opacity:0;pointer-events:none;transition:opacity .25s}
.overlay.show{opacity:1;pointer-events:all}
.sheet{position:fixed;bottom:0;left:0;right:0;background:#FFFFFF!important;border-radius:24px 24px 0 0;z-index:101;max-height:92vh;overflow-y:auto;transform:translateY(100%);transition:transform .3s cubic-bezier(.32,1,.28,1)}
.sheet.show{transform:translateY(0)}
.sheet-handle{width:36px;height:4px;background:var(--border);border-radius:2px;margin:12px auto 0}

/* ─── 設定シート（Trip Memo準拠） ─── */
.sh-header{display:flex;align-items:center;justify-content:space-between;padding:16px 20px 12px;border-bottom:1px solid var(--border);margin-bottom:4px}
.sh-title{font-family:var(--font-display);font-size:18px;font-weight:700;color:var(--text)!important}
.sh-close{background:var(--surface-2)!important;border:none;color:var(--text-2)!important;width:30px;height:30px;border-radius:50%;font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center}
.field{margin-bottom:14px}
.field label{display:block;font-size:10px;font-weight:700;color:var(--text-3)!important;text-transform:uppercase;letter-spacing:.1em;margin-bottom:6px;font-family:var(--font-mono)}
.field input,.field select,.field textarea{width:100%;border:1.5px solid var(--border);border-radius:10px;padding:10px 12px;font-size:16px;color:var(--text)!important;background:var(--surface-2)!important;font-family:var(--font-body);outline:none;-webkit-appearance:none}
.field input:focus,.field select:focus{border-color:var(--accent-mid);background:var(--surface)!important;box-shadow:0 0 0 3px var(--accent-glow)}
.btn-row{margin-bottom:4px}
.btn-exp{width:100%;height:46px;background:var(--accent);color:#fff;border:none;border-radius:12px;font-size:15px;font-weight:700;cursor:pointer;font-family:var(--font-body)}
.btn-exp:disabled{opacity:.6}
.btn-sub{width:100%;height:46px;background:var(--surface-2)!important;color:var(--text-2)!important;border:1.5px solid var(--border);border-radius:12px;font-size:15px;font-weight:600;cursor:pointer;font-family:var(--font-body)}
.btn-save{width:100%;height:46px;background:var(--gold);color:#fff;border:none;border-radius:12px;font-size:15px;font-weight:700;cursor:pointer;font-family:var(--font-body);margin-top:4px}
.sheet-header{display:flex;align-items:center;justify-content:space-between;padding:16px 20px 8px}
.sheet-title{font-size:18px;font-weight:700;font-family:var(--font-display)}
.sheet-close{width:30px;height:30px;border-radius:50%;background:var(--bg-card2)!important;border:none;font-size:18px;color:var(--text-muted)!important;cursor:pointer;display:flex;align-items:center;justify-content:center}
.sheet-body{padding:0 18px 40px}
.form-group{margin-bottom:16px}
.form-label{font-size:10px;font-weight:700;color:var(--text-3)!important;text-transform:uppercase;letter-spacing:.1em;margin-bottom:6px;display:block;font-family:var(--font-mono)}
.form-input,.form-select,.form-textarea{width:100%;border:1.5px solid var(--border);border-radius:10px;padding:10px 12px;font-size:16px;color:var(--text)!important;background:var(--surface-2)!important;font-family:var(--font-body);outline:none;transition:.15s;-webkit-appearance:none}
.form-input:focus,.form-select:focus,.form-textarea:focus{border-color:var(--accent-mid)}
.form-textarea{min-height:90px;resize:vertical;line-height:1.5}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btn-primary{width:100%;height:48px;background:var(--accent);color:#fff;border:none;border-radius:12px;font-size:16px;font-weight:700;cursor:pointer;font-family:var(--font-body);transition:.15s;margin-top:8px}
.btn-primary:active{opacity:.85}
.btn-danger{background:var(--danger)}

/* ─── 詳細シート ─── */
.detail-section{padding:0 20px;margin-bottom:20px}
.detail-section-title{font-size:10px;font-weight:700;color:var(--text-3)!important;text-transform:uppercase;letter-spacing:.1em;margin-bottom:10px;padding-bottom:6px;border-bottom:1px solid var(--border);font-family:var(--font-mono)}
.detail-row{display:flex;justify-content:space-between;align-items:flex-start;padding:6px 0;font-size:14px;border-bottom:1px solid var(--bg-card2)}
.detail-row:last-child{border-bottom:none}
.detail-row .label{color:var(--text-muted)!important;flex-shrink:0;margin-right:12px}
.detail-row .val{text-align:right;font-weight:500;word-break:break-all}
.history-item{padding:10px 0;border-bottom:1px solid var(--bg-card2);font-size:14px}
.history-item:last-child{border-bottom:none}
.history-date{font-size:11px;color:var(--text-muted)!important;margin-bottom:3px}
.history-text{line-height:1.5}
.task-item{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--bg-card2);font-size:14px}
.task-item:last-child{border-bottom:none}
.task-check{width:20px;height:20px;border-radius:5px;border:2px solid var(--border);cursor:pointer;flex-shrink:0;display:flex;align-items:center;justify-content:center;transition:.15s}
.task-check.done{background:var(--accent);border-color:var(--accent);color:#fff;font-size:12px}
.task-done-text{text-decoration:line-through;color:var(--text-muted)!important}
.detail-actions{display:flex;gap:10px;padding:0 20px;margin-bottom:16px}
.detail-actions button{flex:1;height:44px;border-radius:12px;font-size:14px;font-weight:700;cursor:pointer;font-family:inherit;border:1.5px solid var(--border);background:var(--bg-card2)!important;color:var(--text-sub)!important;transition:.15s}
.detail-actions .edit-btn{background:var(--accent-light);color:var(--accent);border-color:var(--accent)}
.detail-actions .del-btn{background:var(--danger-light);color:var(--danger);border-color:var(--danger)}

/* ─── トースト ─── */
#toast{position:fixed;bottom:90px;left:50%;transform:translateX(-50%) translateY(16px);background:var(--text);color:#fff;padding:10px 18px;border-radius:30px;font-size:14px;font-weight:600;z-index:200;opacity:0;transition:opacity .2s,transform .2s;pointer-events:none;white-space:nowrap;display:flex;align-items:center;gap:10px}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
#toast-undo{background:none;border:none;color:var(--gold);font-size:14px;font-weight:700;cursor:pointer;padding:0}

/* ─── フィルターシート ─── */
.filter-options{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
/* ─── ナレッジビュー ─── */
#knowledge-view{flex:1;overflow-y:auto;padding:0;padding-bottom:90px;background:var(--bg)!important;display:none}
.kn-search-bar{display:flex;align-items:center;gap:8px;padding:8px 14px;background:var(--surface)!important;border-bottom:1px solid var(--border);position:sticky;top:0;z-index:5}
.kn-search-wrap{flex:1;position:relative;display:flex;align-items:center;background:var(--surface-2)!important;border:1.5px solid var(--border);border-radius:10px;padding:0 12px;gap:8px;transition:border-color .2s}
.kn-search-wrap:focus-within{border-color:var(--accent-mid);background:var(--surface)!important}
.kn-search-wrap input{flex:1;height:36px;border:none;background:transparent;font-size:16px;color:var(--text)!important;outline:none;font-family:var(--font-body)}
.kn-search-icon{color:var(--text-3)!important;font-size:14px;flex-shrink:0}
.kn-cat-scroll{display:flex;gap:6px;padding:10px 14px;overflow-x:auto;background:var(--surface)!important;border-bottom:1px solid var(--border);-webkit-overflow-scrolling:touch}
.kn-cat-scroll::-webkit-scrollbar{display:none}
.kn-cat-btn{flex-shrink:0;padding:5px 14px;border-radius:20px;border:1.5px solid var(--border);background:var(--surface-2)!important;font-size:12px;font-weight:600;color:var(--text-2)!important;cursor:pointer;font-family:var(--font-body);transition:.15s;white-space:nowrap}
.kn-cat-btn.active{background:var(--accent-light);border-color:var(--accent-mid);color:var(--accent)}
.kn-list{padding:10px 14px}
.kn-card{background:var(--surface)!important;border:1px solid var(--border);border-radius:var(--radius);padding:14px;margin-bottom:10px;cursor:pointer;transition:.15s}
.kn-card:active{opacity:.85}
.kn-card-header{display:flex;align-items:flex-start;gap:8px;margin-bottom:6px}
.kn-cat-badge{flex-shrink:0;font-size:10px;font-weight:700;padding:3px 8px;border-radius:20px;font-family:var(--font-mono);letter-spacing:.03em}
.kn-cat-sales{background:#EDF2FB;color:#3D5A9E}
.kn-cat-tech{background:var(--accent-light);color:var(--accent-mid)}
.kn-cat-trouble{background:var(--danger-light);color:var(--danger)}
.kn-cat-other{background:var(--tag-bg);color:var(--text-2)!important}
.kn-card-title{font-size:15px;font-weight:700;font-family:var(--font-display);color:var(--text)!important;flex:1;line-height:1.3}
.kn-card-body{font-size:13px;color:var(--text-2)!important;line-height:1.5;margin-bottom:8px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.kn-card-meta{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.kn-tag{font-size:11px;background:var(--surface-2)!important;border:1px solid var(--border);color:var(--text-2)!important;padding:2px 8px;border-radius:20px;font-family:var(--font-mono)}
.kn-tag.highlight{background:var(--warn-light);border-color:var(--warn);color:var(--warn)}
.kn-date{font-size:11px;color:var(--text-3)!important;font-family:var(--font-mono);margin-left:auto}
.kn-project-link{font-size:11px;color:var(--accent-mid);font-family:var(--font-mono);margin-top:4px}
.kn-empty{text-align:center;padding:64px 24px;color:var(--text-3)!important}
.kn-empty .icon{font-size:48px;margin-bottom:12px}
.kn-fab{position:fixed;bottom:24px;right:20px;width:54px;height:54px;border-radius:50%;background:var(--gold);color:#fff;font-size:26px;border:none;cursor:pointer;box-shadow:0 4px 16px rgba(201,168,76,.35);display:none;align-items:center;justify-content:center;transition:.18s;z-index:50}
.kn-fab:active{transform:scale(.92)}

/* ナレッジ詳細シート */
.kn-detail-body{font-size:15px;color:var(--text)!important;line-height:1.8;white-space:pre-wrap;padding:0 20px 12px}
.kn-detail-tags{display:flex;flex-wrap:wrap;gap:6px;padding:0 20px 16px}
.kn-detail-actions{display:flex;gap:10px;padding:0 20px 16px}
.kn-detail-actions button{flex:1;height:44px;border-radius:12px;font-size:14px;font-weight:700;cursor:pointer;font-family:var(--font-body);border:1.5px solid var(--border);background:var(--surface-2)!important;color:var(--text-2)!important}
.kn-detail-actions .edit-btn{background:var(--accent-light);color:var(--accent);border-color:var(--accent)}
.kn-detail-actions .del-btn{background:var(--danger-light);color:var(--danger);border-color:var(--danger)}

/* ─── KPI・目標ビュー ─── */
#kpi-view{flex:1;overflow-y:auto;padding:12px 16px;padding-bottom:90px;background:var(--bg)!important;display:none}
.kpi-section{margin-bottom:20px}
.kpi-section-title{font-family:var(--font-display);font-size:16px;font-weight:700;color:var(--text)!important;margin-bottom:12px;padding-bottom:8px;border-bottom:2px solid var(--accent-mid);display:flex;align-items:center;gap:8px}
.kpi-goal-card{background:var(--surface)!important;border:1px solid var(--border);border-radius:var(--radius);padding:16px;margin-bottom:10px}
.kpi-goal-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.kpi-goal-year{font-family:var(--font-mono);font-size:11px;font-weight:700;color:var(--text-3)!important;letter-spacing:.1em}
.kpi-goal-edit-btn{font-size:12px;background:var(--accent-light);color:var(--accent);border:none;padding:4px 10px;border-radius:8px;font-weight:700;cursor:pointer;font-family:var(--font-body)}
.kpi-goal-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.kpi-goal-item{background:var(--surface-2)!important;border-radius:10px;padding:10px 12px}
.kpi-goal-label{font-size:10px;font-weight:700;color:var(--text-3)!important;text-transform:uppercase;letter-spacing:.08em;font-family:var(--font-mono);margin-bottom:4px}
.kpi-goal-val{font-size:22px;font-weight:700;font-family:var(--font-mono);color:var(--text)!important}
.kpi-goal-unit{font-size:12px;color:var(--text-3)!important;font-family:var(--font-mono);margin-left:2px}

.kpi-month-row{background:var(--surface)!important;border:1px solid var(--border);border-radius:var(--radius);padding:14px;margin-bottom:8px}
.kpi-month-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.kpi-month-label{font-family:var(--font-mono);font-size:13px;font-weight:700;color:var(--text)!important}
.kpi-month-dm{display:flex;align-items:center;gap:8px}
.kpi-month-dm-label{font-size:11px;color:var(--text-3)!important;font-family:var(--font-mono)}
.kpi-dm-input{width:60px;height:30px;border:1.5px solid var(--border);border-radius:8px;background:var(--surface-2)!important;text-align:center;font-size:14px;font-weight:700;font-family:var(--font-mono);color:var(--text)!important;outline:none;-webkit-appearance:none}
.kpi-dm-input:focus{border-color:var(--accent-mid);background:var(--surface)!important}
.kpi-metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.kpi-metric{background:var(--surface-2)!important;border-radius:8px;padding:8px 6px;text-align:center}
.kpi-metric-label{font-size:9px;font-weight:700;color:var(--text-3)!important;text-transform:uppercase;letter-spacing:.05em;font-family:var(--font-mono);margin-bottom:3px}
.kpi-metric-val{font-size:16px;font-weight:700;font-family:var(--font-mono);line-height:1.1}
.kpi-metric-rate{font-size:10px;color:var(--text-3)!important;font-family:var(--font-mono);margin-top:1px}
.kpi-bar-wrap{margin-top:8px;height:4px;background:var(--surface-2)!important;border-radius:2px;overflow:hidden}
.kpi-bar-fill{height:100%;border-radius:2px;transition:width .4s}
.kpi-bar-ahead{background:var(--accent-mid)}
.kpi-bar-behind{background:var(--warn)}
.kpi-bar-achieved{background:var(--gold)}
.kpi-pace-badge{display:inline-flex;align-items:center;gap:3px;font-size:10px;font-weight:700;font-family:var(--font-mono);padding:2px 7px;border-radius:20px}
.kpi-pace-ahead{background:var(--accent-light);color:var(--accent-mid)}
.kpi-pace-behind{background:var(--warn-light);color:var(--warn)}
.kpi-pace-on{background:var(--tag-bg);color:var(--text-2)!important}
.kpi-annual-summary{background:var(--surface)!important;border:1px solid var(--border);border-radius:var(--radius);padding:16px;margin-bottom:10px}
.kpi-summary-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.kpi-summary-item{padding:10px 12px;background:var(--surface-2)!important;border-radius:10px}
.kpi-summary-label{font-size:10px;font-weight:700;color:var(--text-3)!important;text-transform:uppercase;letter-spacing:.08em;font-family:var(--font-mono);margin-bottom:4px}
.kpi-summary-row{display:flex;align-items:baseline;gap:6px}
.kpi-summary-actual{font-size:20px;font-weight:700;font-family:var(--font-mono);color:var(--text)!important}
.kpi-summary-target{font-size:12px;color:var(--text-3)!important;font-family:var(--font-mono)}
.kpi-summary-pct{font-size:12px;font-weight:700;font-family:var(--font-mono)}
.kpi-pct-good{color:var(--accent-mid)}
.kpi-pct-warn{color:var(--warn)}

/* ─── ポートフォリオビュー ─── */
#portfolio-view{flex:1;overflow-y:auto;padding:12px 16px;padding-bottom:90px;background:var(--bg)!important;display:none}
.portfolio-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.portfolio-header-title{font-family:var(--font-display);font-size:16px;font-weight:700;color:var(--text)!important}
.portfolio-count{font-size:12px;color:var(--text-3)!important;font-family:var(--font-mono)}
.work-card{background:var(--surface)!important;border:1px solid var(--border);border-radius:var(--radius);padding:14px;margin-bottom:10px;cursor:pointer;transition:.15s}
.work-card:active{opacity:.85}
.work-card-header{display:flex;align-items:flex-start;gap:8px;margin-bottom:6px}
.work-card-title{font-size:15px;font-weight:700;font-family:var(--font-display);flex:1;line-height:1.3;color:var(--text)!important}
.work-status-badge{flex-shrink:0;font-size:10px;font-weight:700;padding:3px 8px;border-radius:20px;letter-spacing:.3px;font-family:var(--font-mono)}
.ws-demo{background:var(--warn-light);color:var(--warn)}
.ws-active{background:var(--accent-light);color:var(--accent-mid)}
.ws-revision{background:var(--accent2-light);color:var(--accent2)}
.ws-archived{background:var(--tag-bg);color:var(--text-3)!important}
.work-card-company{font-size:13px;color:var(--text-2)!important;margin-bottom:6px;display:flex;align-items:center;gap:4px}
.work-card-url{font-size:11px;color:var(--accent-mid);font-family:var(--font-mono);word-break:break-all;margin-bottom:6px}
.work-card-meta{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.work-card-date{font-size:11px;color:var(--text-3)!important;font-family:var(--font-mono)}
.work-card-memo{font-size:12px;color:var(--text-2)!important;margin-top:6px;line-height:1.5;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.work-open-btn{display:flex;align-items:center;gap:6px;margin-top:10px;padding:8px 14px;background:var(--accent);color:#fff;border:none;border-radius:10px;font-size:13px;font-weight:700;cursor:pointer;font-family:var(--font-body);text-decoration:none;transition:.15s}
.work-open-btn:active{opacity:.8}
.portfolio-empty{text-align:center;padding:64px 24px;color:var(--text-3)!important}
.portfolio-empty .icon{font-size:48px;margin-bottom:12px}

.filter-option{padding:6px 14px;border-radius:20px;border:1.5px solid var(--border);background:var(--surface-2)!important;font-size:12.5px;font-weight:400;color:var(--text-2)!important;cursor:pointer;transition:.15s}
.filter-option.sel{background:var(--accent-light);border-color:var(--accent-mid);color:var(--accent)}
.section-sep{font-size:10px;font-weight:700;color:var(--text-3)!important;text-transform:uppercase;letter-spacing:.1em;margin:14px 0 8px;font-family:var(--font-mono)}
</style>
</head>
<body>

<script>
(function(){
'use strict';

// ─── データ ───────────────────────────────────
const STORE = 'anken_v1';
let projects = [];
let undoData = null, undoTimer = null;

// フィルター状態
let filters = { status: [], priority: [], source: [] };
let searchQ = '';

function load(){
  try{ projects = JSON.parse(localStorage.getItem(STORE)||'[]'); }catch(e){ projects=[]; }
}
function save(){
  localStorage.setItem(STORE, JSON.stringify(projects));
}
load();

// ─── 定数 ────────────────────────────────────
const STATUS_MAP = {
  candidate:{label:'候補',cls:'st-candidate'},
  contact:{label:'打診中',cls:'st-contact'},
  proposal:{label:'提案中',cls:'st-proposal'},
  negotiation:{label:'折衝中',cls:'st-negotiation'},
  won:{label:'受注',cls:'st-won'},
  lost:{label:'失注',cls:'st-lost'},
  hold:{label:'保留',cls:'st-hold'},
};
const PRIORITY_MAP = {
  high:{label:'高',mark:'priority-high'},
  mid:{label:'中',mark:'priority-mid'},
  low:{label:'低',mark:'priority-low'},
};

// ─── タブ ─────────────────────────────────────
let activeTab = 'list';
const tabEls = document.querySelectorAll('.tab');
const mainEl = document.getElementById('main');
const dashEl = document.getElementById('dash');
const searchBarEl = document.getElementById('search-bar');
const fabEl = document.getElementById('fab');

const portfolioEl = document.getElementById('portfolio-view');
const kpiEl = document.getElementById('kpi-view');
const knowledgeEl = document.getElementById('knowledge-view');

tabEls.forEach(t => t.addEventListener('click', () => {
  activeTab = t.dataset.tab;
  tabEls.forEach(x => x.classList.toggle('active', x === t));
    const views = {list:mainEl, dash:dashEl, portfolio:portfolioEl, kpi:kpiEl, knowledge:knowledgeEl};
  Object.entries(views).forEach(([k,v]) => { v.style.display = k===activeTab ? '' : 'none'; });
  searchBarEl.style.display = activeTab === 'list' ? '' : 'none';
  fabEl.style.display = activeTab === 'list' ? '' : 'none';
  if(activeTab === 'dash') renderDash();
  if(activeTab === 'portfolio') renderPortfolio();
  if(activeTab === 'knowledge') renderKnowledge();
}));

// ─── 検索・フィルター ────────────────────────
document.getElementById('search-input').addEventListener('input', e => {
  searchQ = e.target.value.toLowerCase();
  renderList();
});

function matchProject(p){
  const q = searchQ;
  if(q && !( (p.company||'').toLowerCase().includes(q) ||
             (p.contact||'').toLowerCase().includes(q) ||
             (p.contactInfo||'').toLowerCase().includes(q) ||
             (p.memo||'').toLowerCase().includes(q) ||
             (p.source||'').toLowerCase().includes(q) )) return false;
  if(filters.status.length && !filters.status.includes(p.status)) return false;
  if(filters.priority.length && !filters.priority.includes(p.priority)) return false;
  if(filters.source.length && !filters.source.includes(p.source||'')) return false;
  return true;
}

// フィルターシート
const filterSheetEl = document.getElementById('filter-sheet');
document.getElementById('filter-toggle').addEventListener('click', openFilterSheet);
document.getElementById('filter-close').addEventListener('click', closeSheet);
document.getElementById('filter-clear').addEventListener('click', () => {
  filters = {status:[],priority:[],source:[]};
  buildFilterOptions();
  renderList();
  document.getElementById('filter-toggle').classList.remove('active');
});

function openFilterSheet(){
  buildFilterOptions();

function buildFilterOptions(){
  // ステータス
  const stEl = document.getElementById('filter-status');
  stEl.innerHTML = '';
  Object.entries(STATUS_MAP).forEach(([k,v]) => {
    const b = document.createElement('button');
    b.className = 'filter-option' + (filters.status.includes(k) ? ' sel' : '');
    b.textContent = v.label;
    b.addEventListener('click', () => {
      filters.status = toggle(filters.status, k);
      b.classList.toggle('sel', filters.status.includes(k));
      renderList(); updateFilterBtn();
    });
    stEl.appendChild(b);
  });
  // 優先度
  const prEl = document.getElementById('filter-priority');
  prEl.innerHTML = '';
  Object.entries(PRIORITY_MAP).forEach(([k,v]) => {
    const b = document.createElement('button');
    b.className = 'filter-option' + (filters.priority.includes(k) ? ' sel' : '');
    b.textContent = v.label;
    b.addEventListener('click', () => {
      filters.priority = toggle(filters.priority, k);
      b.classList.toggle('sel', filters.priority.includes(k));
      renderList(); updateFilterBtn();
    });
    prEl.appendChild(b);
  });
  // ソース
  const srcEl = document.getElementById('filter-source-list');
  srcEl.innerHTML = '';
  const sources = [...new Set(projects.map(p => p.source).filter(Boolean))];
  sources.forEach(s => {
    const b = document.createElement('button');
    b.className = 'filter-option' + (filters.source.includes(s) ? ' sel' : '');
    b.textContent = s;
    b.addEventListener('click', () => {
      filters.source = toggle(filters.source, s);
      b.classList.toggle('sel', filters.source.includes(s));
      renderList(); updateFilterBtn();
    });
    srcEl.appendChild(b);
  });
}
function toggle(arr, v){ return arr.includes(v) ? arr.filter(x=>x!==v) : [...arr,v]; }
function updateFilterBtn(){
  const active = filters.status.length + filters.priority.length + filters.source.length > 0;
  document.getElementById('filter-toggle').classList.toggle('active', active);
}

// ─── スワイプ ─────────────────────────────────
function addSwipe(wrap, card, bg, onDelete){
  let startX=0, dx=0, dragging=false;
  const threshold = 80;
  function start(x){ startX=x; dx=0; dragging=true; }
  function move(x){
    if(!dragging) return;
    dx = Math.min(0, x - startX);
    const r = Math.min(1, Math.abs(dx)/threshold);
    card.style.transform = `translateX(${dx}px)`;
    bg.style.opacity = r > 0.2 ? String(r) : '0';
  }
  function end(){
    if(!dragging) return; dragging=false;
    if(dx < -threshold){
      card.style.transform = 'translateX(-100%)';
      bg.style.opacity = '1';
      setTimeout(()=>{ wrap.style.opacity='0'; wrap.style.transition='opacity .2s'; setTimeout(onDelete,200); }, 200);
    } else {
      card.style.transform = ''; bg.style.opacity = '0';
    }
    dx = 0;
  }
  card.addEventListener('touchstart', e=>start(e.touches[0].clientX), {passive:true});
  card.addEventListener('touchmove', e=>move(e.touches[0].clientX), {passive:true});
  card.addEventListener('touchend', end);
}

let undoFn = null;

function showToast(msg){
  clearTimeout(undoTimer);
  toastMsg.textContent = msg;
  toastUndo.style.display = 'none';
  undoFn = null;
  toastEl.classList.add('show');
  undoTimer = setTimeout(()=>toastEl.classList.remove('show'), 2500);
}
function showUndo(msg, fn){
  clearTimeout(undoTimer);
  toastMsg.textContent = msg;
  toastUndo.style.display = '';
  undoFn = fn;
  toastEl.classList.add('show');
  undoTimer = setTimeout(()=>{ toastEl.classList.remove('show'); undoFn=null; }, 4000);
}
toastUndo.addEventListener('click', ()=>{
  clearTimeout(undoTimer);
  if(undoFn){ undoFn(); undoFn=null; }
  toastEl.classList.remove('show');
});

function dlJson(fn, json){

  setTimeout(()=>{ document.body.removeChild(a); URL.revokeObjectURL(url); }, 1000);
}

function exportNas(cfg, fn, json, cb){
  const base = 'https://'+cfg.ip+':'+cfg.port+'/webapi';
  fetch(base+'/auth.cgi?api=SYNO.API.Auth&version=3&method=login&account='+
    encodeURIComponent(cfg.user)+'&passwd='+encodeURIComponent(cfg.pass)+
    '&session=FileStation&format=sid')
  .then(r=>r.json())
  .then(d=>{
    if(!d.success) throw new Error('login');
    const sid = d.data.sid;
    const blob = new Blob([json],{type:'application/json'});
    const fd = new FormData();
    fd.append('api','SYNO.FileStation.Upload'); fd.append('version','2'); fd.append('method','upload');
    fd.append('path','/'+cfg.folder.replace(/^\//,''));
    fd.append('create_parents','true'); fd.append('overwrite','true');
    fd.append('*sid',sid); fd.append('file',blob,fn);
    return fetch(base+'/entry.cgi',{method:'POST',body:fd})
      .then(r=>r.json())
      .then(up=>{
        if(!up.success) throw new Error('upload');
        pruneNas(base,sid,cfg.folder,()=>{ logoutNas(base,sid); cb(true); });
      });
  })
  .catch(()=>cb(false));
}

function pruneNas(base, sid, folder, done){
  fetch(base+'/entry.cgi?api=SYNO.FileStation.List&version=2&method=list&folder_path=/'+
    encodeURIComponent(folder.replace(/^\//,''))+
    '&pattern=anken_backup**.json&sort_by=name&sort_direction=ASC&_sid='+encodeURIComponent(sid))
  .then(r=>r.json())
  .then(d=>{
    if(!d.success){ done(); return; }
    const files = d.data.files||[];
    const toDel = files.slice(0, Math.max(0, files.length-MG));
    if(!toDel.length){ done(); return; }
    fetch(base+'/entry.cgi',{
      method:'POST', headers:{'Content-Type':'application/x-www-form-urlencoded'},
      body:'api=SYNO.FileStation.Delete&version=2&method=start&path='+
        encodeURIComponent(JSON.stringify(toDel.map(f=>f.path)))+
        '&recursive=true&_sid='+encodeURIComponent(sid)
    }).then(()=>done()).catch(()=>done());
  }).catch(()=>done());
}

function logoutNas(base, sid){
  fetch(base+'/auth.cgi?api=SYNO.API.Auth&version=1&method=logout&session=FileStation&_sid='+encodeURIComponent(sid))
    .catch(()=>{});
}

function doExport(){
  const btn = document.getElementById('expBtn');
  if(btn){ btn.disabled=true; btn.textContent='送信中…'; }
  const cfg = loadNas();
  const has = cfg && cfg.ip && cfg.user && cfg.pass && cfg.folder;
  const fn = 'anken_backup_'+nowStr()+'.json';
  const json = JSON.stringify({exported: new Date().toISOString(), projects}, null, 2);

  function done(toNas){
    closeSheet();
    showToast(toNas ? 'NASにバックアップしました ✓' : 'エクスポートしました ✓');
  }
  if(has){
    exportNas(cfg, fn, json, ok=>{
      if(ok){ done(true); }
      else { dlJson(fn, json); closeSheet(); showToast('NAS失敗 → ファイルに保存しました'); }
    });
  } else { dlJson(fn, json); done(false); }
}

  reader.onload = ev=>{
    try{
      const data = JSON.parse(ev.target.result);
      const imported = data.projects || (Array.isArray(data) ? data : []);
      const eids = {};
      projects.forEach(p=>{ eids[p.id]=true; });
      let added = 0;
      imported.forEach(p=>{
        if(!p.id) p.id = 'p_'+Date.now()+'_'+Math.random().toString(36).slice(2);
        if(!eids[p.id]){ projects.push(p); added++; }
      });

    }catch(err){
      showToast('インポートに失敗しました');
    }
    e.target.value='';
  };
  reader.readAsText(file);
});

// ─── KPI・目標管理 ───────────────────────
const KPI_STORE = 'anken_kpi_v1';

function loadKpiData(){
  try{ return JSON.parse(localStorage.getItem(KPI_STORE)||'{}'); }catch(e){ return {}; }
}
function saveKpiData(d){ localStorage.setItem(KPI_STORE, JSON.stringify(d)); }

// 対象年度リスト（前年〜来年）
function kpiYearOptions(){
  const y = new Date().getFullYear();
  return [y-1, y, y+1];
}

// 月ラベル生成（年度の4月〜翌3月）
function kpiFiscalMonths(fy){
  const months = [];
  for(let m=0; m<12; m++){
    const d = new Date(fy, 3+m, 1); // 4月始まり
    months.push({ year:d.getFullYear(), month:d.getMonth(), label:`${d.getFullYear()}/${String(d.getMonth()+1).padStart(2,'0')}` });
  }
  return months;
}

// 案件データから月別実績を集計
function calcMonthlyActuals(fy){
  const months = kpiFiscalMonths(fy);
  months.forEach(m => {
    const inMonth = projects.filter(p => {
      const d = new Date(p.createdAt||0);
      return d.getFullYear()===m.year && d.getMonth()===m.month;
    });
    const replied  = inMonth.filter(p => !['candidate'].includes(p.status)).length;
    const meeting  = inMonth.filter(p => ['proposal','negotiation','won','lost'].includes(p.status)).length;
    const won      = inMonth.filter(p => p.status==='won').length;
    const revenue  = inMonth.filter(p => p.status==='won').reduce((s,p)=>s+(Number(p.amount)||0),0);
    m.cases   = inMonth.length;
    m.replied = replied;
    m.meeting = meeting;
    m.won     = won;
    m.revenue = revenue;
  });
  return months;
}

// KPIビュー描画
function renderKpi(){
  const el = document.getElementById('kpi-view');
  const data = loadKpiData();
  const curYear = new Date().getFullYear();
  // 現在の会計年度（4月始まり）
  const curFy = new Date().getMonth() >= 3 ? new Date().getFullYear() : new Date().getFullYear()-1;
  const fy = data.activeFy || curFy;
  const goal = (data.goals||{})[fy] || {};
  const months = calcMonthlyActuals(fy);

  // 年度集計
  const totDm      = months.reduce((s,m)=>s+(data.dm?.[fy]?.[m.label]||0),0);
  const totReplied = months.reduce((s,m)=>s+m.replied,0);
  const totMeeting = months.reduce((s,m)=>s+m.meeting,0);
  const totWon     = months.reduce((s,m)=>s+m.won,0);
  const totRevenue = months.reduce((s,m)=>s+m.revenue,0);
  const replyRate  = totDm ? Math.round(totReplied/totDm*100) : 0;
  const meetRate   = totDm ? Math.round(totMeeting/totDm*100) : 0;
  const cvRate     = totDm ? Math.round(totWon/totDm*100) : 0;

  // 月次行HTML
  const now = new Date();
  const monthRows = months.map(m => {
    const dm = (data.dm||{})[fy]?.[m.label] || 0;
    const rr = dm ? Math.round(m.replied/dm*100) : 0;
    const mr = dm ? Math.round(m.meeting/dm*100) : 0;
    const cr = dm ? Math.round(m.won/dm*100) : 0;
    const isPast  = new Date(m.year, m.month+1, 0) < now;
    const isCur   = m.year===now.getFullYear() && m.month===now.getMonth();
    // ペース判定（DM目標との比較）
    const dmGoalMon = goal.dm ? Math.round(goal.dm/12) : 0;
    let paceCls='kpi-pace-on', paceLabel='―';
    if(dmGoalMon && isPast){
      if(dm >= dmGoalMon){ paceCls='kpi-pace-ahead'; paceLabel='達成'; }
      else { paceCls='kpi-pace-behind'; paceLabel='未達'; }
    }
    const barPct = dmGoalMon ? Math.min(100, Math.round(dm/dmGoalMon*100)) : 0;
    const barCls = dm >= dmGoalMon ? 'kpi-bar-achieved' : (isPast ? 'kpi-bar-behind' : 'kpi-bar-ahead');
    return `
      <div class="kpi-month-row" style="${isCur ? 'border-color:var(--accent-mid);box-shadow:0 0 0 2px var(--accent-glow)' : ''}">
        <div class="kpi-month-header">
          <span class="kpi-month-label">${m.label}${isCur ? ' <span style="font-size:9px;background:var(--accent-light);color:var(--accent-mid);padding:1px 6px;border-radius:10px;font-family:var(--font-mono)">今月</span>' : ''}</span>
          <div class="kpi-month-dm">
            <span class="kpi-month-dm-label">DM数</span>
            <input class="kpi-dm-input" type="number" min="0" value="${dm}" data-fy="${fy}" data-mon="${m.label}" inputmode="numeric">
            <span class="kpi-pace-badge ${paceCls}">${paceLabel}</span>
          </div>
        </div>
        ${dmGoalMon ? `<div class="kpi-bar-wrap"><div class="kpi-bar-fill ${barCls}" style="width:${barPct}%"></div></div><div style="font-size:10px;color:var(--text-3);font-family:var(--font-mono);margin-top:3px;margin-bottom:8px">目標 ${dmGoalMon}件 / 実績 ${dm}件</div>` : ''}
        <div class="kpi-metrics">
          <div class="kpi-metric">
            <div class="kpi-metric-label">返信</div>
            <div class="kpi-metric-val">${m.replied}</div>
            <div class="kpi-metric-rate">${rr}%</div>
          </div>
          <div class="kpi-metric">
            <div class="kpi-metric-label">商談</div>
            <div class="kpi-metric-val">${m.meeting}</div>
            <div class="kpi-metric-rate">${mr}%</div>
          </div>
          <div class="kpi-metric">
            <div class="kpi-metric-label">成約</div>
            <div class="kpi-metric-val">${m.won}</div>
            <div class="kpi-metric-rate">${cr}%</div>
          </div>
          <div class="kpi-metric">
            <div class="kpi-metric-label">売上</div>
            <div class="kpi-metric-val" style="font-size:13px">${m.revenue}</div>
            <div class="kpi-metric-rate">万</div>
          </div>
        </div>
      </div>`;
  }).join('');

  // 年間進捗サマリーのパーセント計算
  function pct(actual, target){
    if(!target) return '―';
    const v = Math.round(actual/target*100);
    const cls = v>=100?'kpi-pct-good':(v>=70?'':'kpi-pct-warn');
    return `<span class="kpi-summary-pct ${cls}">${v}%</span>`;
  }

  el.innerHTML = `
    <div class="kpi-section">

    <div class="kpi-section">
      <div class="kpi-section-title">📊 年度累計進捗</div>

        <div class="kpi-summary-grid">

          <div class="kpi-summary-item">
            <div class="kpi-summary-label">返信率</div>
            <div class="kpi-summary-row"><span class="kpi-summary-actual">${replyRate}</span><span class="kpi-summary-target">% / ${goal.reply||'―'}%</span></div>
          </div>
          <div class="kpi-summary-item">
            <div class="kpi-summary-label">商談率</div>
            <div class="kpi-summary-row"><span class="kpi-summary-actual">${meetRate}</span><span class="kpi-summary-target">% / ${goal.meeting||'―'}%</span></div>
          </div>
          <div class="kpi-summary-item">
            <div class="kpi-summary-label">成約CV率</div>
            <div class="kpi-summary-row"><span class="kpi-summary-actual">${cvRate}</span><span class="kpi-summary-target">% / ${goal.cv||'―'}%</span></div>
          </div>
          <div class="kpi-summary-item" style="grid-column:span 2">
            <div class="kpi-summary-label">売上</div>
            <div class="kpi-summary-row"><span class="kpi-summary-actual">${totRevenue}</span><span class="kpi-summary-target">万 / ${goal.revenue||'―'}万</span>${pct(totRevenue,goal.revenue)}</div>
          </div>

  // 年度切り替えボタン
  el.querySelectorAll('[data-fy-btn]').forEach(btn=>{
    btn.addEventListener('click',()=>{
      const d = loadKpiData();
      d.activeFy = parseInt(btn.dataset.fyBtn);

      renderKpi();

  // 目標編集ボタン

  // DM入力（debounce保存）

  el.querySelectorAll('.kpi-dm-input').forEach(inp=>{

// ─── 月別受注データ構築 ────────────────────
function buildMonthlyRevenue(){
  const months = [];
  const now = new Date();
  for(let i=5; i>=0; i--){
    const d = new Date(now.getFullYear(), now.getMonth()-i, 1);
    months.push({
      label: `${d.getMonth()+1}月`,
      year:  d.getFullYear(),
      month: d.getMonth(),
      amount: 0,
      count:  0,
    });
  }
  projects.filter(p=>p.status==='won').forEach(p=>{
    const d = new Date(p.updatedAt||p.createdAt||0);
    const m = months.find(x=>x.year===d.getFullYear() && x.month===d.getMonth());
    if(m){ m.amount += Number(p.amount)||0; m.count++; }
  });
  return months;
}

  drawBar('c-status',

  drawBar('c-priority',

    ['high','mid','low'].map(k=>projects.filter(p=>p.priority===k).length),

    );
  } else {

  }
}

// ─── 折れ線グラフ ─────────────────────────
function drawLine(canvasId, labels, data, C){
  const canvas = document.getElementById(canvasId);
  if(!canvas) return;
  const dpr = window.devicePixelRatio||1;
  const W = canvas.offsetWidth||300;
  const H = parseInt(canvas.getAttribute('height'))||180;
  canvas.width=W*dpr; canvas.height=H*dpr;
  canvas.style.width=W+'px'; canvas.style.height=H+'px';
  const ctx = canvas.getContext('2d');
  ctx.scale(dpr,dpr);

  const padL=36, padR=12, padT=16, padB=28;
  const cW = W-padL-padR;
  const cH = H-padT-padB;
  const max = Math.max(...data, 1);
  const step = cW/(labels.length-1||1);

  // gridと目盛
  ctx.strokeStyle=C.border; ctx.lineWidth=1;
  for(let i=0;i<=4;i++){
    const y = padT+cH*(1-i/4);
    ctx.beginPath(); ctx.moveTo(padL,y); ctx.lineTo(W-padR,y); ctx.stroke();
    ctx.fillStyle=C.text3; ctx.font=`10px -apple-system,sans-serif`; ctx.textAlign='right';
    ctx.fillText(Math.round(max*i/4), padL-4, y+3);
  }

  // 塗りつぶしエリア
  const pts = data.map((v,i)=>({x:padL+step*i, y:padT+cH*(1-v/max)}));
  ctx.beginPath();
  ctx.moveTo(pts[0].x, H-padB);
  pts.forEach(p=>ctx.lineTo(p.x, p.y));
  ctx.lineTo(pts[pts.length-1].x, H-padB);
  ctx.closePath();
  const grad = ctx.createLinearGradient(0,padT,0,H-padB);
  grad.addColorStop(0, C.mid+'55');
  grad.addColorStop(1, C.mid+'08');
  ctx.fillStyle=grad; ctx.fill();

  // 線
  ctx.beginPath(); ctx.moveTo(pts[0].x, pts[0].y);
  pts.forEach(p=>ctx.lineTo(p.x,p.y));
  ctx.strokeStyle=C.mid; ctx.lineWidth=2.5; ctx.lineJoin='round'; ctx.stroke();

  // ドットと値
  pts.forEach((p,i)=>{
    ctx.beginPath(); ctx.arc(p.x,p.y,4,0,Math.PI*2);
    ctx.fillStyle=data[i]>0?C.mid:C.border; ctx.fill();
    ctx.strokeStyle='#fff'; ctx.lineWidth=2; ctx.stroke();
    if(data[i]>0){
      ctx.fillStyle=C.text; ctx.font=`700 11px -apple-system,sans-serif`; ctx.textAlign='center';
      ctx.fillText(data[i]+'万', p.x, p.y-10);
    }
    ctx.fillStyle=C.text3; ctx.font=`11px -apple-system,sans-serif`;
    ctx.fillText(labels[i], p.x, H-padB+16);
  });
}

// ─── 棒グラフ ─────────────────────────────
function drawBar(canvasId, labels, data, colors, C){
  const canvas = document.getElementById(canvasId);
  if(!canvas) return;
  const dpr = window.devicePixelRatio||1;
  const W = canvas.offsetWidth||300;
  const H = parseInt(canvas.getAttribute('height'))||180;
  canvas.width=W*dpr; canvas.height=H*dpr;
  canvas.style.width=W+'px'; canvas.style.height=H+'px';
  const ctx = canvas.getContext('2d');
  ctx.scale(dpr,dpr);

  const padL=8, padR=8, padT=16, padB=32;
  const cW = W-padL-padR;
  const max = Math.max(...data,1);
  const barGap = cW/labels.length;
  const barW   = barGap*0.58;

  // grid
  ctx.strokeStyle=C.border; ctx.lineWidth=1;
  for(let i=1;i<=4;i++){
    const y = padT+(H-padT-padB)*(1-i/4);
    ctx.beginPath(); ctx.moveTo(padL,y); ctx.lineTo(W-padR,y); ctx.stroke();
  }

  data.forEach((v,i)=>{
    const bh = (H-padT-padB)*(v/max);
    const x  = padL+barGap*i+barGap/2-barW/2;
    const y  = H-padB-bh;
    ctx.fillStyle = v>0 ? colors[i%colors.length] : C.border;
    roundRect(ctx,x,y,barW,Math.max(bh,2),4); ctx.fill();
    if(v>0){
      ctx.fillStyle=C.text; ctx.font=`700 12px -apple-system,sans-serif`; ctx.textAlign='center';
      ctx.fillText(v, x+barW/2, y-4);
    }
    ctx.fillStyle=C.text3; ctx.font=`11px -apple-system,sans-serif`;
    const lbl=labels[i].length>5?labels[i].slice(0,5)+'…':labels[i];
    ctx.fillText(lbl, x+barW/2, H-padB+16);
  });
}

function drawEmpty(canvasId, C){
  const canvas = document.getElementById(canvasId);
  if(!canvas) return;
  const dpr=window.devicePixelRatio||1;
  const W=canvas.offsetWidth||300;
  const H=parseInt(canvas.getAttribute('height'))||170;
  canvas.width=W*dpr; canvas.height=H*dpr;
  canvas.style.width=W+'px'; canvas.style.height=H+'px';
  const ctx=canvas.getContext('2d');
  ctx.scale(dpr,dpr);
  ctx.fillStyle=C.text3; ctx.font=`13px -apple-system,sans-serif`; ctx.textAlign='center';
  ctx.fillText('データなし', W/2, H/2+4);
}

function roundRect(ctx,x,y,w,h,r){
  if(h<r) r=h; if(w<r*2) r=w/2;
  ctx.beginPath();
  ctx.moveTo(x+r,y); ctx.lineTo(x+w-r,y);
  ctx.quadraticCurveTo(x+w,y,x+w,y+r);
  ctx.lineTo(x+w,y+h); ctx.lineTo(x,y+h);
  ctx.lineTo(x,y+r);
  ctx.quadraticCurveTo(x,y,x+r,y);
  ctx.closePath();
}

// ─── ユーティリティ ───────────────────────────
function esc(s){ return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

// ─── 初期表示 ─────────────────────────────────
// 全ビューを確実に初期化
[dashEl, portfolioEl, kpiEl, knowledgeEl].forEach(el => { el.style.display = 'none'; });
mainEl.style.display = '';
renderList();

})();
